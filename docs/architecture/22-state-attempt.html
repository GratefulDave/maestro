<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Attempt settle · Only SEMANTIC mutates_prompt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-accent:  #f08a59;   /* accent */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Maestro</p>
    <h1>Attempt settle · Only SEMANTIC mutates_prompt</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="22-state-attempt-title 22-state-attempt-desc">
      <title id="22-state-attempt-title">Attempt settle · Only SEMANTIC mutates_prompt</title>
      <desc id="22-state-attempt-desc">One live AttemptRecord starts RUNNING under idx_one_live_attempt_per_node; _settle_failure classifies SEMANTIC, ENVIRONMENTAL, or LAUNCHER_TRANSIENT, while _release_unclassified_attempt leaves retry_class NULL; CLOSED_ATTEMPT_STATE CANCELLED releases the index; only SEMANTIC mutates_prompt; CREDENTIAL and DETERMINISTIC_REFUSAL spend launcher_retry_budget 0.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- start → RUNNING -->
      <line x1="64" y1="328" x2="200" y2="328" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RUNNING → SEMANTIC -->
      <path d="M 440 300 H 472 A 8 8 0 0 0 480 292 V 112 A 8 8 0 0 1 488 104 H 640" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RUNNING → ENVIRONMENTAL -->
      <path d="M 440 316 H 504 A 8 8 0 0 0 512 308 V 256 A 8 8 0 0 1 520 248 H 640" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RUNNING → LAUNCHER_TRANSIENT -->
      <path d="M 440 332 H 536 A 8 8 0 0 1 544 340 V 384 A 8 8 0 0 0 552 392 H 640" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RUNNING → UNCLASSIFIED -->
      <path d="M 440 348 H 568 A 8 8 0 0 1 576 356 V 528 A 8 8 0 0 0 584 536 H 640" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- SEMANTIC fail_attempt / mutates_prompt -->
      <path d="M 920 80 H 1000 A 8 8 0 0 1 1008 88 V 120 A 8 8 0 0 1 1000 128 H 920" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ENVIRONMENTAL fail_attempt -->
      <path d="M 920 224 H 1000 A 8 8 0 0 1 1008 232 V 264 A 8 8 0 0 1 1000 272 H 920" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LAUNCHER_TRANSIENT fail_attempt [spent &lt; budget] -->
      <path d="M 920 368 H 1000 A 8 8 0 0 1 1008 376 V 408 A 8 8 0 0 1 1000 416 H 920" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- UNCLASSIFIED → end -->
      <line x1="920" y1="536" x2="1008" y2="536" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="88" y="308" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="132" y="318" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START_ATTEMPT</text>

      <rect x="536" y="84" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="564" y="94" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLASSIFY</text>

      <rect x="552" y="228" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="580" y="238" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text>

      <rect x="564" y="372" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="592" y="382" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLASSIFY</text>

      <rect x="504" y="436" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="532" y="446" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>

      <rect x="1016" y="96" width="96" height="12" rx="2" fill="#2d3142"/>
      <text x="1064" y="106" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MUTATES_PROMPT</text>

      <rect x="1016" y="240" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="1056" y="250" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL_ATTEMPT</text>

      <rect x="1016" y="384" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="1056" y="394" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL_ATTEMPT</text>

      <rect x="924" y="516" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="964" y="526" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANCELLED</text>

      <!-- Start -->
      <circle cx="56" cy="328" r="6" fill="#f5f5f5"/>

      <!-- RUNNING -->
      <rect x="200" y="288" width="240" height="80" rx="8" fill="#2d3142"/>
      <rect x="200" y="288" width="240" height="80" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="208" y="294" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="224" y="304" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
      <text x="320" y="336" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNNING</text>
      <text x="320" y="352" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LIVE_ATTEMPT_INDEX</text>

      <!-- SEMANTIC (focal) -->
      <rect x="640" y="64" width="280" height="80" rx="8" fill="#2d3142"/>
      <rect x="640" y="64" width="280" height="80" rx="8" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <rect x="648" y="70" width="40" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="668" y="80" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLASS</text>
      <text x="780" y="112" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEMANTIC</text>
      <text x="780" y="128" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mutates_prompt</text>

      <!-- ENVIRONMENTAL -->
      <rect x="640" y="208" width="280" height="80" rx="8" fill="#2d3142"/>
      <rect x="640" y="208" width="280" height="80" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="648" y="214" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="668" y="224" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLASS</text>
      <text x="780" y="256" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ENVIRONMENTAL</text>
      <text x="780" y="272" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DEFAULT_RETRY_CLASS</text>

      <!-- LAUNCHER_TRANSIENT -->
      <rect x="640" y="352" width="280" height="80" rx="8" fill="#2d3142"/>
      <rect x="640" y="352" width="280" height="80" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="648" y="358" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="668" y="368" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLASS</text>
      <text x="780" y="400" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LAUNCHER_TRANSIENT</text>
      <text x="780" y="416" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">credential_retries=0</text>

      <!-- UNCLASSIFIED -->
      <rect x="640" y="496" width="280" height="80" rx="8" fill="#2d3142"/>
      <rect x="640" y="496" width="280" height="80" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="648" y="502" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
      <text x="664" y="512" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NULL</text>
      <text x="780" y="544" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UNCLASSIFIED</text>
      <text x="780" y="560" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">retry_class NULL</text>

      <!-- End -->
      <circle cx="1024" cy="536" r="8" fill="none" stroke="#f5f5f5" stroke-width="1"/>
      <circle cx="1024" cy="536" r="5" fill="#f5f5f5"/>

      <!-- Callouts -->
      <text x="40" y="400" fill="#f5f5f5" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">CLOSED_ATTEMPT_STATE = CANCELLED</text>
      <path d="M 200 404 Q 260 384 320 368" fill="none" stroke="rgba(245,245,245,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="320" cy="368" r="2" fill="#f5f5f5"/>

      <text x="1240" y="456" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">DETERMINISTIC_REFUSAL spends 0</text>
      <path d="M 1120 448 Q 960 448 780 432" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="780" cy="432" r="2" fill="#f5f5f5"/>

      <!-- Legend -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="160" y="668" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="184" y="678" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">LIVE RUNNING</text>

      <rect x="360" y="668" width="16" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="384" y="678" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">SEMANTIC CLASS</text>

      <rect x="560" y="668" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="584" y="678" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">CLASSIFIED</text>

      <rect x="736" y="668" width="16" height="12" rx="2" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="678" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">UNCLASSIFIED</text>

      <circle cx="920" cy="674" r="4" fill="#f5f5f5"/>
      <text x="932" y="678" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">START / END</text>
    </svg>
  </div>
</body>
</html>
