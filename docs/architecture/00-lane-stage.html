    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    .eyebrow {

      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);

      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .lede {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 48rem;
    }
    .lede a { color: var(--color-link); }
    .lede a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .figure { overflow-x: auto; }
    svg { width: 100%; height: auto; display: block; }
    @media (max-width: 720px) {
      body { padding: 2rem 1.25rem; }
    }

  <div class="frame">
    <p class="eyebrow">Current · State machine</p>
    <h1>One field, nine stages</h1>
    <p class="lede"><code>lane_state.stage</code> is the sole durable workflow authority. <code>REVISE</code> is artifact data, not a tenth stage. Pause and amendment move a lane to <code>WAITING_FOR_USER</code>. <a href="00-artifact-factory.html">Factory architecture</a> · <a href="index.html">Gallery</a> · <a href="../index.html">Docs home</a></p>
