<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2d3142">
  <title>Maestro layers · The signed receipt is the gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dark.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-accent:  #f08a59;   /* accent */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { overflow-x: auto; max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Maestro</p>
    <h1>Maestro layers · The signed receipt is the gate</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-layers-title 02-layers-desc">
      <title id="02-layers-title">Maestro layers · The signed receipt is the gate</title>
      <desc id="02-layers-desc">Layer stack from the visualizer’s read-only MaestroDb poll and maestro.py, through the signed Receipt gate (on-disk filename remains maestro-plan.v1; v1–v4 run, v5 is schema-only and not startable), WorkspaceCoordinator, Scheduler and LifecycleStore, down to AttemptWorktree isolation and a Herdr pane. L3 is a sibling path of L2 under maestro.py, not a parent of the scheduler. No live hidden composed-tree or hidden-gate layer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Direction column -->
      <text x="40" y="144" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OPERATOR</text>
      <line x1="80" y1="160" x2="80" y2="544" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <polygon points="76,160 84,160 80,152" fill="#bfc0c0"/>
      <text x="40" y="564" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ISOLATION</text>

      <!-- Stack silhouette -->
      <line x1="160" y1="160" x2="1240" y2="160" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <line x1="160" y1="544" x2="1240" y2="544" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>

      <!-- L6 — Visualizer (observation; MaestroDb never writes lifecycle) -->
      <rect x="160" y="160" width="1080" height="64" fill="#393e53"/>
      <line x1="160" y1="224" x2="1240" y2="224" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="180" y="196" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="320" y="196" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Visualizer</text>
      <text x="1220" y="196" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">MaestroDb · read-only poll</text>

      <!-- L5 — Operator CLI -->
      <rect x="160" y="224" width="1080" height="64" fill="#393e53"/>
      <line x1="160" y1="288" x2="1240" y2="288" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="180" y="260" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="320" y="260" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Operator CLI</text>
      <text x="1220" y="260" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">maestro.py · start · amend</text>

      <!-- L4 — Plan identity (FOCAL): signed Receipt is the gate; v1–v4 runnable; v5 unrunnable -->
      <rect x="160" y="288" width="1080" height="64" fill="rgba(240,138,89,0.08)"/>
      <rect x="160" y="288" width="1080" height="64" fill="none" stroke="#f08a59" stroke-width="1"/>
      <text x="180" y="324" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L4</text>
      <text x="320" y="324" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Plan identity</text>
      <text x="1220" y="324" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">v1–v4 run · v5 unrunnable · Receipt</text>

      <!-- L3 — Workspace coordinator -->
      <rect x="160" y="352" width="1080" height="64" fill="#393e53"/>
      <line x1="160" y1="416" x2="1240" y2="416" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="180" y="388" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="320" y="388" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Workspace coordinator</text>
      <text x="1220" y="388" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">sibling of L2 · CoordinatorStore</text>

      <!-- L2 — Run scheduler + lifecycle SQLite -->
      <rect x="160" y="416" width="1080" height="64" fill="#393e53"/>
      <line x1="160" y1="480" x2="1240" y2="480" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="180" y="452" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="320" y="452" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Run scheduler</text>
      <text x="1220" y="452" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">Scheduler · LifecycleStore</text>

      <!-- L1 — Isolation -->
      <rect x="160" y="480" width="1080" height="64" fill="#393e53"/>
      <text x="180" y="516" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="320" y="516" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Isolation</text>
      <text x="1220" y="516" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AttemptWorktree · Herdr pane</text>

      <!-- Caption -->
      <text x="160" y="584" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="280" y="584" fill="#bfc0c0" font-size="12" font-family="'Instrument Serif', serif" font-style="italic">A signed Receipt is the gate — one verdict about one plan_digest. Filename maestro-plan.v1. v5 cannot start a run. No hidden composed-tree layer.</text>

      <!-- Legend -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="160" y="668" width="12" height="12" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="180" y="680" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">signed Receipt</text>
      <rect x="360" y="668" width="12" height="12" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="380" y="680" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">L6 observation · L5–L1 write</text>
    </svg>
  </div>
</body>
</html>
