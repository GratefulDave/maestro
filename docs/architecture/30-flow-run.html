<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Scheduler.run · ready_nodes until ACCEPTED or BLOCKED</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-accent:  #f08a59;   /* accent */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Scheduler.run · ready_nodes until ACCEPTED or BLOCKED</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="30-flow-run-title 30-flow-run-desc">
      <title id="30-flow-run-title">Scheduler.run · ready_nodes until ACCEPTED or BLOCKED</title>
      <desc id="30-flow-run-desc">Scheduler.run loop: a PASS receipt and eligible plan admit create_run, ready_nodes whose deps are MERGED dispatch concurrent worktree take_baseline launch attempts, verify to VERIFIED, merge_frontier in (depth, node_id) order, then declare ACCEPTED or BLOCKED.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows first -->
      <!-- admitted YES → create_run -->
      <line x1="560" y1="136" x2="560" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- admitted NO → RUN_RECEIPT_NOT_PASS -->
      <line x1="660" y1="88" x2="880" y2="88" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- create_run → ready_nodes -->
      <line x1="560" y1="216" x2="560" y2="248" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ready_nodes READY → worktree (coral) -->
      <line x1="560" y1="312" x2="560" y2="344" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- ready_nodes QUIESCENT → ACCEPTED -->
      <line x1="680" y1="280" x2="880" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- worktree → verify -->
      <line x1="560" y1="408" x2="560" y2="440" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- verify FAIL → BLOCKED -->
      <line x1="660" y1="488" x2="880" y2="488" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- verify VERIFIED → merge_frontier -->
      <line x1="560" y1="536" x2="560" y2="568" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- merge_frontier MERGED → ready_nodes (loop) -->
      <path d="M 460,592 H 328 Q 320,592 320,584 V 288 Q 320,280 328,280 H 440"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="572" y="144" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="592" y="154" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

      <rect x="732" y="68" width="76" height="12" rx="2" fill="#2d3142"/>
      <text x="770" y="78" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT PASS</text>

      <rect x="572" y="224" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="602" y="234" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING</text>

      <rect x="572" y="320" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="596" y="330" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READY</text>

      <rect x="740" y="260" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="780" y="270" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUIESCENT</text>

      <rect x="750" y="468" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="770" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

      <rect x="572" y="544" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="604" y="554" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFIED</text>

      <rect x="256" y="428" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="284" y="438" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MERGED</text>

      <!-- Diamond: receipt+plan admitted? -->
      <polygon points="560,40 660,88 560,136 460,88" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="84" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">receipt+plan</text>
      <text x="560" y="100" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">admitted?</text>

      <!-- End: RUN_RECEIPT_NOT_PASS -->
      <rect x="880" y="64" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="84" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">not PASS</text>
      <text x="980" y="100" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RUN_RECEIPT_NOT_PASS</text>

      <!-- Step: create_run -->
      <rect x="460" y="168" width="200" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="188" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">create_run</text>
      <text x="560" y="204" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING</text>

      <!-- Focal: ready_nodes -->
      <rect x="440" y="248" width="240" height="64" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="560" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ready_nodes</text>
      <text x="560" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deps MERGED · concurrent</text>

      <!-- End: ACCEPTED -->
      <rect x="880" y="256" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ACCEPTED</text>
      <text x="980" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RunOutcome</text>

      <!-- Step: worktree + take_baseline + launch -->
      <rect x="460" y="344" width="200" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worktree</text>
      <text x="560" y="388" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">take_baseline · launch</text>

      <!-- Diamond: verify? -->
      <polygon points="560,440 660,488 560,536 460,488" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verify?</text>

      <!-- End: BLOCKED -->
      <rect x="880" y="464" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="484" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>
      <text x="980" y="500" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RunOutcome</text>

      <!-- Step: merge_frontier -->
      <rect x="460" y="568" width="200" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="588" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">merge_frontier</text>
      <text x="560" y="604" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(depth, node_id)</text>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Start / end (oval)</text>

      <rect x="240" y="688" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="272" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step (rectangle)</text>

      <polygon points="452,694 464,688 476,694 464,700" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="488" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision (diamond)</text>

      <rect x="660" y="688" width="24" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="692" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">ready_nodes (focal)</text>

      <line x1="900" y1="694" x2="928" y2="694" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="936" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">READY dispatch</text>
    </svg>
  </div>
</body>
</html>
