<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Scheduler.run · ready_nodes until _declare</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-accent:  #f08a59;   /* accent */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Scheduler.run · ready_nodes until _declare</h1>

    <svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="30-flow-run-title 30-flow-run-desc">
      <title id="30-flow-run-title">Scheduler.run · ready_nodes until _declare</title>
      <desc id="30-flow-run-desc">Scheduler.run loop: admission checks the PASS receipt, plan eligibility, and each node's SEMANTIC budget summed across every earlier run of the same plan digest, refusing before any ledger write (RUN_RECEIPT_NOT_PASS, RUN_RECEIPT_ABSENT, RUN_PLAN_NOT_CANONICAL_OR_ELIGIBLE, schema unrunnable, NODE_BUDGET_EXHAUSTED_ACROSS_RUNS). Otherwise create_run, ready_nodes whose deps are MERGED dispatch concurrent worktree take_baseline launch attempts. Post-gate fail is fail_attempt (PENDING retry), not an immediate BLOCKED. For an agent node whose post-node gate PASSED, falsify_outputs runs before mark_verified. A gate still green with its subject reverted is SEMANTIC into fail_attempt / the repair chain. Quiescence goes to _declare (ACCEPTED, BLOCKED, STUCK, or CANCELLED), not straight to ACCEPTED.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows first -->
      <!-- admitted YES → create_run -->
      <line x1="560" y1="136" x2="560" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- admitted NO → RUN_RECEIPT_NOT_PASS -->
      <line x1="680" y1="88" x2="880" y2="88" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- create_run → ready_nodes -->
      <line x1="560" y1="216" x2="560" y2="248" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ready_nodes READY → worktree (coral) -->
      <line x1="560" y1="312" x2="560" y2="344" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- ready_nodes QUIESCENT → ACCEPTED -->
      <line x1="680" y1="280" x2="880" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- worktree → verify -->
      <line x1="560" y1="408" x2="560" y2="440" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- verify FAIL → BLOCKED -->
      <line x1="660" y1="488" x2="880" y2="488" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- verify VERIFIED → falsify_outputs (§7.4's other half) -->
      <line x1="560" y1="536" x2="560" y2="568" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- falsify_outputs: gate still green with subject reverted → SEMANTIC (focal) -->
      <line x1="660" y1="616" x2="880" y2="616" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- falsify_outputs: gate went red as required → merge_frontier -->
      <line x1="560" y1="664" x2="560" y2="696" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- merge_frontier MERGED → ready_nodes (loop) -->
      <path d="M 460,720 H 328 Q 320,720 320,712 V 288 Q 320,280 328,280 H 440"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="572" y="144" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="592" y="154" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

      <rect x="740" y="68" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="770" y="78" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFUSED</text>

      <rect x="572" y="224" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="602" y="234" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING</text>

      <rect x="572" y="320" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="596" y="330" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READY</text>

      <rect x="740" y="260" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="780" y="270" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUIESCENT</text>

      <rect x="750" y="468" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="770" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

      <rect x="572" y="544" width="80" height="12" rx="2" fill="#2d3142"/>
      <text x="612" y="554" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST PASS</text>

      <rect x="676" y="596" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="700" y="606" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GREEN</text>

      <rect x="572" y="672" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="588" y="682" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RED</text>

      <rect x="256" y="700" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="284" y="710" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MERGED</text>

      <!-- Diamond: receipt+plan admitted? -->
      <polygon points="560,40 680,88 560,136 440,88" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="84" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">receipt+plan+budget</text>
      <text x="560" y="100" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">admitted?</text>

      <!-- End: the two admission refusals, before any ledger write -->
      <rect x="880" y="48" width="280" height="80" rx="24" fill="#2d3142"/>
      <rect x="880" y="48" width="280" height="80" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="1020" y="76" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run refused</text>
      <text x="1020" y="92" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RUN_RECEIPT_NOT_PASS · ABSENT</text>
      <text x="1020" y="106" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NOT_CANONICAL_OR_ELIGIBLE · v1</text>
      <text x="1020" y="118" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NODE_BUDGET_EXHAUSTED_ACROSS_RUNS</text>

      <!-- Callout: B10's escape, typed and recorded -->
      <text x="1240" y="176" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">--allow-exhausted-node is recorded, not remembered.</text>
      <path d="M 940,170 Q 948,150 958,132" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="960" cy="128" r="2" fill="#f5f5f5"/>

      <!-- Step: create_run -->
      <rect x="460" y="168" width="200" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="188" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">create_run</text>
      <text x="560" y="204" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING</text>

      <!-- Focal: ready_nodes -->
      <rect x="440" y="248" width="240" height="64" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="560" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ready_nodes</text>
      <text x="560" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deps MERGED · concurrent</text>

      <!-- End: _declare (not always ACCEPTED) -->
      <rect x="880" y="248" width="200" height="64" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">_declare</text>
      <text x="980" y="288" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACCEPTED · BLOCKED</text>
      <text x="980" y="300" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STUCK · CANCELLED</text>

      <!-- Step: worktree + take_baseline + launch -->
      <rect x="460" y="344" width="200" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="372" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">worktree</text>
      <text x="560" y="388" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">take_baseline · launch</text>

      <!-- Diamond: verify? -->
      <polygon points="560,440 660,488 560,536 460,488" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verify?</text>

      <!-- End: fail_attempt (retry) / BLOCKED only on budget -->
      <rect x="880" y="456" width="200" height="64" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="480" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fail_attempt</text>
      <text x="980" y="496" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING retry</text>
      <text x="980" y="508" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BLOCKED only on budget</text>

      <!-- Diamond: falsify_outputs — §7.4's other half (focal) -->
      <polygon points="560,568 660,616 560,664 460,616" fill="#2d3142"/>
      <polygon points="560,568 660,616 560,664 460,616" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="560" y="612" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gate still green?</text>
      <text x="560" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">subject reverted</text>

      <!-- End: SEMANTIC — refused into the repair chain, never a block -->
      <rect x="880" y="592" width="200" height="48" rx="24" fill="#2d3142"/>
      <rect x="880" y="592" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="980" y="612" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEMANTIC</text>
      <text x="980" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fail_attempt · repair (§7.5)</text>

      <!-- Step: merge_frontier -->
      <rect x="460" y="696" width="200" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="560" y="716" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mark_verified · merge</text>
      <text x="560" y="732" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">after falsify · (depth, node_id)</text>

      <!-- Callout: the reverted-subject question is asked, not assumed -->
      <text x="1240" y="552" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">A test file its author wrote cannot certify code its author wrote.</text>
      <path d="M 984,564 Q 984,576 980,588" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="980" cy="590" r="2" fill="#f5f5f5"/>

      <!-- Legend -->
      <line x1="40" y1="776" x2="1240" y2="776" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="796" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="808" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="818" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Start / end (oval)</text>

      <rect x="240" y="808" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="272" y="818" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step (rectangle)</text>

      <polygon points="452,814 464,808 476,814 464,820" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="488" y="818" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision (diamond)</text>

      <rect x="660" y="808" width="24" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="692" y="818" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal — ready_nodes · falsify_outputs</text>

      <line x1="960" y1="814" x2="988" y2="814" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="996" y="818" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">READY dispatch</text>
    </svg>
  </div>
</body>
</html>
