<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2d3142">
  <title>Unread candidate · Review, do not rebuild</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dark.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { overflow-x: auto; max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Unread candidate · Review, do not rebuild</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="35-flow-unreviewed-title 35-flow-unreviewed-desc">
      <title id="35-flow-unreviewed-title">Unread candidate · Review, do not rebuild</title>
      <desc id="35-flow-unreviewed-desc">Scheduler._resume_unreviewed_candidate reviews the last CandidateReview still PUBLISHED or DISPATCHED at the candidate SHA with no builder, so HEAD and the attempt ref both hold it; PASS merges derived build::review, REJECT can prepare_descendant_candidate without HeadMoved, a builder cut from that SHA is GATE_NOT_FALSIFIABLE, and a terminal review or no candidate falls through to an ordinary attempt at the integration head.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="480" y1="168" x2="600" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="216" x2="360" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="200" x2="760" y2="248" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="880" y1="296" x2="1000" y2="296" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="344" x2="760" y2="392" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="524" y="148" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="540" y="158" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="324" y="234" width="28" height="12" rx="2" fill="#2d3142"/>
      <text x="338" y="244" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="920" y="276" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="940" y="286" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>

      <rect x="700" y="362" width="52" height="12" rx="2" fill="#2d3142"/>
      <text x="726" y="372" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REJECT</text>

      <!-- last review PUBLISHED or DISPATCHED? -->
      <polygon points="360,120 480,168 360,216 240,168" fill="#2d3142"/>
      <polygon points="360,120 480,168 360,216 240,168" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="360" y="164" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">last review</text>
      <text x="360" y="180" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PUBLISHED or DISPATCHED</text>

      <!-- ordinary attempt at integration head -->
      <rect x="240" y="264" width="240" height="56" rx="28" fill="#2d3142"/>
      <rect x="240" y="264" width="240" height="56" rx="28" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="360" y="288" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ordinary attempt</text>
      <text x="360" y="304" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">at integration head</text>

      <!-- review, no builder; worktree at candidate SHA (focal) -->
      <rect x="600" y="136" width="320" height="64" rx="6" fill="#2d3142"/>
      <rect x="600" y="136" width="320" height="64" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="760" y="164" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">review, no builder</text>
      <text x="760" y="180" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">worktree at candidate SHA</text>

      <!-- review PASS? -->
      <polygon points="760,248 880,296 760,344 640,296" fill="#2d3142"/>
      <polygon points="760,248 880,296 760,344 640,296" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="760" y="300" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">review PASS?</text>

      <!-- merge (derived build::review) -->
      <rect x="1000" y="272" width="240" height="48" rx="24" fill="#2d3142"/>
      <rect x="1000" y="272" width="240" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="1120" y="292" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">merge</text>
      <text x="1120" y="308" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">derived build::review</text>

      <!-- repair descendant of candidate -->
      <rect x="640" y="392" width="240" height="56" rx="6" fill="#2d3142"/>
      <rect x="640" y="392" width="240" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="760" y="416" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">repair descendant</text>
      <text x="760" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">prepare_descendant_candidate</text>

      <!-- Callout (not a node) -->
      <text x="1240" y="80" fill="#f08a59" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">builder cut from the candidate SHA → GATE_NOT_FALSIFIABLE</text>
      <path d="M 1000,92 Q 960,112 920,136" fill="none" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="920" cy="136" r="2" fill="#f08a59"/>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">End (oval)</text>

      <rect x="180" y="688" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="212" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="300,696 312,688 324,696 312,704" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="336" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <rect x="432" y="688" width="24" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="464" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal — review, no builder</text>
    </svg>
  </div>
</body>
</html>
