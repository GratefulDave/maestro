      margin-bottom: 0.5rem;
    }

      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .lede {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 48rem;
    }
    .lede a { color: var(--color-link); }
    .lede a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .figure { overflow-x: auto; }
    svg { width: 100%; height: auto; display: block; }

    <h1>Nine-stage artifact factory</h1>
    <p class="lede">Durable authority is one <code>lane_state.stage</code> field plus immutable artifacts under an external <code>runtime_state_root</code>. Herdr and OMP are transport only. Historical gallery diagrams are superseded. <a href="00-lane-stage.html">Lane stage machine</a> · <a href="index.html">Gallery</a> · <a href="../index.html">Docs home</a></p>
