<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Admit a repair, inherit the witness, then seal</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { overflow-x: auto; max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Admit a repair, inherit the witness, then seal</h1>

    <svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="34-flow-repair-chain-title 34-flow-repair-chain-desc">
      <title id="34-flow-repair-chain-title">Admit a repair, inherit the witness, then seal</title>
      <desc id="34-flow-repair-chain-desc">A repair chain opens only when the attempt is serviceable: _continue_repair_handoff still requires a SEMANTIC failure with a stored output SHA, and tests or builder REJECTED is delivered by continue_tests_node or continue_node, while an unserviceable handoff raises UnserviceableHandoff and _block_unserviceable_handoff records REPAIR_HANDOFF_UNSERVICEABLE; refusals restart at head with a fresh base and no repair_of, and an admitted attempt a2 bases on the output, re-points the pane, inherits the chain-root witness through _pre_candidate_base (earliest attempt.base_sha), then seals with commit_measured_delta if HEAD equals base or sealed_descendant_tip otherwise — adopt does not spend ENVIRONMENTAL — with identical findings blocking SEMANTIC_REFUSAL_REPEATED at IDENTICAL_REFUSAL_LIMIT 2. A worktree cut at the candidate is for review and repair landing, not a legal build base: a builder cut from the candidate blocks GATE_NOT_FALSIFIABLE.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="440" y1="96" x2="440" y2="136" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="184" x2="800" y2="184" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="232" x2="440" y2="272" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="320" x2="800" y2="320" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="368" x2="440" y2="392" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="440" y1="440" x2="440" y2="472" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="520" x2="440" y2="552" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="664" y="164" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="680" y="174" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="404" y="246" width="28" height="12" rx="2" fill="#2d3142"/>
      <text x="418" y="256" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="652" y="300" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="680" y="310" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFUSED</text>

      <rect x="368" y="374" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="400" y="384" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADMITTED</text>

      <!-- 1. chain root a1 -->
      <rect x="300" y="40" width="280" height="56" rx="6" fill="#2d3142"/>
      <rect x="300" y="40" width="280" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="440" y="64" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">attempt a1 · chain root</text>
      <text x="440" y="80" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">base = head · pre RED, post GREEN</text>

      <!-- 2. repairable? -->
      <polygon points="440,136 560,184 440,232 320,184" fill="#2d3142"/>
      <polygon points="440,136 560,184 440,232 320,184" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="440" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">repairable?</text>
      <text x="440" y="188" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEMANTIC+SHA</text>
      <text x="440" y="200" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tests/builder REJECTED</text>

      <!-- 3. unserviceable BLOCKED -->
      <rect x="800" y="160" width="280" height="48" rx="24" fill="#2d3142"/>
      <rect x="800" y="160" width="280" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="940" y="180" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>
      <text x="940" y="194" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REPAIR_HANDOFF_UNSERVICEABLE</text>

      <!-- 4. admit repair (focal) -->
      <polygon points="440,272 560,320 440,368 320,320" fill="#2d3142"/>
      <polygon points="440,272 560,320 440,368 320,320" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="440" y="316" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">admit repair</text>
      <text x="440" y="332" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chain limit · refusals</text>

      <!-- 5. restart at head -->
      <rect x="800" y="296" width="280" height="48" rx="24" fill="#2d3142"/>
      <rect x="800" y="296" width="280" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="940" y="316" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">restart at head</text>
      <text x="940" y="330" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fresh base · no repair_of</text>

      <!-- 6. repair attempt a2 (focal) -->
      <rect x="300" y="392" width="280" height="48" rx="6" fill="#2d3142"/>
      <rect x="300" y="392" width="280" height="48" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="440" y="412" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">attempt a2 · repair</text>
      <text x="440" y="426" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">base = output · pane re-point</text>

      <!-- 7. witness from chain root -->
      <rect x="300" y="472" width="280" height="48" rx="6" fill="#2d3142"/>
      <rect x="300" y="472" width="280" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="440" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">witness from chain root</text>
      <text x="440" y="506" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">_pre_candidate_base</text>

      <!-- 8. seal -->
      <rect x="300" y="552" width="280" height="56" rx="24" fill="#2d3142"/>
      <rect x="300" y="552" width="280" height="56" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="440" y="576" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">seal output</text>
      <text x="440" y="592" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">commit if HEAD=base · else adopt tip</text>

      <!-- Callouts -->
      <text x="800" y="408" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Identical findings → SEMANTIC_REFUSAL_REPEATED (limit 2)</text>
      <path d="M 792,416 H 588" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="580" cy="416" r="2" fill="#f5f5f5"/>

      <text x="800" y="572" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Adopt does not spend ENVIRONMENTAL.</text>
      <path d="M 792,580 H 588" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="580" cy="580" r="2" fill="#f5f5f5"/>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">End (oval)</text>

      <rect x="180" y="688" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="212" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="300,692 312,688 324,692 312,700" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="336" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <rect x="432" y="688" width="24" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="464" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal — admit repair · repair attempt</text>
    </svg>
  </div>
</body>
</html>
