<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2d3142">
  <title>Maestro mind modules</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dark.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { overflow-x: auto; max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Maestro runtime</p>
    <h1>Mind modules</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="40-mind-modules-title 40-mind-modules-desc">

      <desc id="40-mind-modules-desc">Tree of maestro.py collapsing live adw_modules into Plan, Run, Workspace, and ADW leftover clusters. Plan holds hidden_vault (separate object DB) and gate_capture; Run holds plan_amendment plus the finalization node-review kernel. Launcher stays transport. Composed hidden-gate machinery is not built; v5 is unrunnable.</desc>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Tier tags -->
      <text x="40" y="88" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
      <text x="40" y="236" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1 · CLUSTER</text>
      <text x="40" y="384" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 2 · MODULE</text>

      <!-- Connectors: trunk, sibling bus, child drops (tree T-junctions) -->

      <path d="M 208 200 L 1072 200" fill="none" stroke="#bfc0c0" stroke-width="1"/>
      <path d="M 208 200 L 208 248" fill="none" stroke="#bfc0c0" stroke-width="1"/>
      <path d="M 496 200 L 496 248" fill="none" stroke="#bfc0c0" stroke-width="1"/>

      <path d="M 1072 200 L 1072 248" fill="none" stroke="#bfc0c0" stroke-width="1"/>
      <!-- Plan → hidden_vault, gate_capture -->

      <path d="M 118 348 L 282 348" fill="none" stroke="#bfc0c0" stroke-width="1"/>
      <path d="M 118 348 L 118 392" fill="none" stroke="#bfc0c0" stroke-width="1"/>

      <rect x="568" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="582" y="113" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="640" y="132" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">maestro.py</text>

      <rect x="88" y="248" width="240" height="48" rx="6" fill="#2d3142"/>

      <text x="208" y="288" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">plan_validate · plan_digest</text>

      <rect x="376" y="248" width="240" height="48" rx="6" fill="#2d3142"/>

      <!-- Workspace cluster leaf: coordinator.py -->
      <rect x="664" y="248" width="240" height="48" rx="6" fill="#2d3142"/>

      <rect x="960" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>

      <text x="1072" y="288" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">gates · data_types</text>

      <!-- Plan module: hidden_vault.py -->
      <rect x="48" y="392" width="140" height="48" rx="6" fill="#2d3142"/>
      <rect x="48" y="392" width="140" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="56" y="400" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="74" y="409" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="118" y="420" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hidden_vault.py</text>
      <text x="118" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">separate object DB</text>

      <!-- Plan module: gate_capture.py -->
      <rect x="212" y="392" width="140" height="48" rx="6" fill="#2d3142"/>
      <rect x="212" y="392" width="140" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="220" y="400" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="238" y="409" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="282" y="420" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gate_capture.py</text>
      <text x="282" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">provenance · floor</text>

      <!-- Run module: plan_amendment.py -->
      <rect x="416" y="392" width="160" height="48" rx="6" fill="#2d3142"/>
      <rect x="416" y="392" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="424" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="438" y="409" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="496" y="420" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plan_amendment.py</text>
      <text x="496" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">run amend · not resume</text>

      <!-- Legend strip -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="684" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="60" y="692" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Root · maestro.py</text>

      <rect x="220" y="684" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="240" y="692" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Collapsed cluster leaf</text>

      <text x="460" y="692" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal · scheduler.py</text>
      <text x="680" y="692" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace">deliver.py · enforcement.py live on maestro path, not ADW leftover</text>

  </div>
</body>
</html>
