<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>How an operator command becomes a run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-accent:  #f08a59;   /* accent */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 40rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>How an operator command becomes a run</h1>
    <p class="lede">Scheduler owns sequencing. HerdrLauncher is transport only.</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-system-title 01-system-desc">
      <title id="01-system-title">How an operator command becomes a run</title>
      <desc id="01-system-desc">Architecture of Maestro showing run start flowing from the operator through maestro.py to the Scheduler, which sequences LifecycleStore, AttemptWorktree, and HerdrLauncher transport to an omp or Claude coding agent, while the visualizer polls SQLite.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Zone: RUNTIME (Scheduler + LifecycleStore) -->
      <rect x="496" y="196" width="224" height="304" rx="8"
            fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <rect x="576" y="200" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="608" y="209" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">RUNTIME</text>

      <!-- Arrows first -->
      <!-- Operator → maestro.py -->
      <line x1="184" y1="280" x2="268" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- maestro.py → Scheduler -->
      <line x1="428" y1="280" x2="512" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Scheduler → HerdrLauncher -->
      <line x1="704" y1="280" x2="788" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- HerdrLauncher → coding agent -->
      <line x1="964" y1="280" x2="1048" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Scheduler → LifecycleStore -->
      <line x1="576" y1="328" x2="576" y2="416" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Scheduler → AttemptWorktree (orthogonal elbow r=8) -->
      <path d="M 640,328 V 364 Q 640,372 648,372 H 840 Q 848,372 848,380 V 416"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- visualizer → LifecycleStore (async poll) -->
      <line x1="200" y1="448" x2="512" y2="448" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="194" y="260" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="226" y="269" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN START</text>

      <rect x="442" y="260" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="470" y="269" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

      <rect x="720" y="260" width="52" height="12" rx="2" fill="#2d3142"/>
      <text x="746" y="269" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAUNCH</text>

      <rect x="970" y="260" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="1006" y="269" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGENT START</text>

      <rect x="514" y="366" width="52" height="12" rx="2" fill="#2d3142"/>
      <text x="540" y="375" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEDGER</text>

      <rect x="718" y="352" width="52" height="12" rx="2" fill="#2d3142"/>
      <text x="744" y="361" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>

      <rect x="336" y="428" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="356" y="437" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLL</text>

      <!-- Node: Operator (input) -->
      <rect x="40" y="248" width="144" height="64" rx="6" fill="#2d3142"/>
      <rect x="40" y="248" width="144" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
      <rect x="48" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>
      <text x="60" y="265" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OP</text>
      <text x="112" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
      <text x="112" y="292" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run start</text>

      <!-- Node: maestro.py (backend) -->
      <rect x="268" y="248" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="268" y="248" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="276" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="290" y="265" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="348" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">maestro.py</text>
      <text x="348" y="292" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_execute_run</text>

      <!-- Node: Scheduler (focal) -->
      <rect x="512" y="232" width="192" height="96" rx="6" fill="#2d3142"/>
      <rect x="512" y="232" width="192" height="96" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <rect x="520" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="534" y="249" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAG</text>
      <text x="696" y="320" fill="rgba(240,138,89,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="608" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
      <text x="608" y="296" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run()</text>

      <!-- Node: HerdrLauncher (backend, transport) -->
      <rect x="788" y="248" width="176" height="64" rx="6" fill="#2d3142"/>
      <rect x="788" y="248" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="796" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="812" y="265" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PANE</text>
      <text x="876" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HerdrLauncher</text>
      <text x="876" y="292" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">launch · poll</text>

      <!-- Node: coding agent (external) -->
      <rect x="1048" y="248" width="192" height="64" rx="6" fill="#2d3142"/>
      <rect x="1048" y="248" width="192" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="1056" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="1070" y="265" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="1144" y="276" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">coding agent</text>
      <text x="1144" y="292" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">omp · claude</text>

      <!-- Node: visualizer (async) -->
      <rect x="40" y="416" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="40" y="416" width="160" height="64" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="48" y="424" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.20)" stroke-width="0.8"/>
      <text x="60" y="433" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="120" y="444" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">visualizer</text>
      <text x="120" y="460" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MaestroDb</text>

      <!-- Node: LifecycleStore (store) -->
      <rect x="512" y="416" width="192" height="64" rx="6" fill="#2d3142"/>
      <rect x="512" y="416" width="192" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="520" y="424" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
      <text x="534" y="433" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
      <text x="608" y="444" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LifecycleStore</text>
      <text x="608" y="460" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lifecycle.sqlite3</text>

      <!-- Node: AttemptWorktree (backend) -->
      <rect x="788" y="416" width="176" height="64" rx="6" fill="#2d3142"/>
      <rect x="788" y="416" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="796" y="424" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="810" y="433" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="876" y="444" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AttemptWorktree</text>
      <text x="876" y="460" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git worktree add</text>

      <!-- Legend strip -->
      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="684" width="16" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="64" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal / Scheduler</text>

      <rect x="220" y="684" width="16" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="244" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Backend</text>

      <rect x="340" y="684" width="16" height="12" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="364" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Store</text>

      <rect x="440" y="684" width="16" height="12" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="464" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">External</text>

      <rect x="560" y="684" width="16" height="12" rx="2" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
      <text x="584" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Operator</text>

      <rect x="688" y="684" width="16" height="12" rx="2" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="712" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Async / UI</text>

      <line x1="820" y1="690" x2="852" y2="690" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="860" y="694" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Poll SQLite</text>
    </svg>
  </div>
</body>
</html>
