<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Escapes from BLOCKED</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Escapes from BLOCKED</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="32-flow-escape-title 32-flow-escape-desc">
      <title id="32-flow-escape-title">Escapes from BLOCKED</title>
      <desc id="32-flow-escape-desc">Flowchart of operator escapes from a BLOCKED node: retry (plain RETRY, or RETRY_FORCE via --force/--grant when SEMANTIC budget is exhausted, which goes PENDING immediately), skip --accept-sha, and abandon. A review-budget grant stays BLOCKED on the exact attempt; only absence-proven run resume returns that same attempt to PENDING, with no replacement worktree. A RUNNING escape fails closed on SCHEDULER_STILL_ALIVE or SCHEDULER_LIVENESS_UNKNOWN. skip requires git ancestry proof. run resume is refused against ACCEPTED and CANCELLED.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows (behind nodes) -->
      <line x1="380" y1="88" x2="380" y2="120" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="168" x2="680" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="216" x2="380" y2="316" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="200" x2="760" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="200" x2="840" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 720,184 L 568,184 A 8,8 0 0 0 560,192 L 560,312 A 8,8 0 0 1 552,320 L 388,320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="324" x2="380" y2="376" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="424" x2="200" y2="424" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="472" x2="380" y2="504" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="552" x2="380" y2="584" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="424" x2="560" y2="424" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="564" y="148" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="580" y="156" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="388" y="256" width="24" height="12" rx="2" fill="#2d3142"/>
      <text x="400" y="264" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="664" y="220" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="708" y="228" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STILL_ALIVE</text>

      <rect x="848" y="220" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="884" y="228" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNKNOWN</text>

      <rect x="512" y="240" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="532" y="248" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEAD</text>

      <rect x="212" y="404" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="232" y="412" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>

      <rect x="388" y="476" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="404" y="484" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKIP</text>

      <rect x="388" y="556" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="424" y="564" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANCESTRY</text>

      <rect x="500" y="404" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="524" y="412" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABANDON</text>

      <!-- Merge dot -->
      <circle cx="380" cy="320" r="4" fill="#f5f5f5"/>

      <!-- BLOCKED -->
      <rect x="280" y="40" width="200" height="48" rx="20" fill="#2d3142"/>
      <rect x="280" y="40" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="380" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>
      <text x="380" y="76" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REVIEW grant stays</text>

      <!-- RUNNING? -->
      <polygon points="380,120 480,168 380,216 280,168" fill="#2d3142"/>
      <polygon points="380,120 480,168 380,216 280,168" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="380" y="172" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNNING?</text>

      <!-- scheduler_liveness (focal) -->
      <polygon points="800,120 920,168 800,216 680,168" fill="#2d3142"/>
      <polygon points="800,120 920,168 800,216 680,168" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="800" y="164" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scheduler_liveness</text>
      <text x="800" y="180" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unknown is not dead</text>

      <!-- EscapeRefusal (focal) -->
      <rect x="680" y="264" width="240" height="80" rx="20" fill="#2d3142"/>
      <rect x="680" y="264" width="240" height="80" rx="20" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="800" y="292" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EscapeRefusal</text>
      <text x="800" y="312" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SCHEDULER_STILL_ALIVE</text>
      <text x="800" y="328" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SCHEDULER_LIVENESS_UNKNOWN</text>

      <!-- Which Escape? -->
      <polygon points="380,376 500,424 380,472 260,424" fill="#2d3142"/>
      <polygon points="380,376 500,424 380,472 260,424" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="380" y="420" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Which Escape?</text>
      <text x="380" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEMANTIC RETRY_FORCE</text>

      <!-- PENDING -->
      <rect x="40" y="400" width="160" height="48" rx="20" fill="#2d3142"/>
      <rect x="40" y="400" width="160" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="120" y="420" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PENDING</text>
      <text x="120" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEMANTIC --force/--grant</text>

      <!-- skip --accept-sha -->
      <rect x="280" y="504" width="200" height="48" rx="6" fill="#2d3142"/>
      <rect x="280" y="504" width="200" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="380" y="524" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">skip --accept-sha</text>
      <text x="380" y="540" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">is-ancestor</text>

      <!-- MERGED -->
      <rect x="280" y="584" width="200" height="48" rx="20" fill="#2d3142"/>
      <rect x="280" y="584" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="380" y="604" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MERGED</text>
      <text x="380" y="620" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OPERATOR_ACCEPTED</text>

      <!-- CANCELLED -->
      <rect x="560" y="384" width="240" height="80" rx="20" fill="#2d3142"/>
      <rect x="560" y="384" width="240" height="80" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="680" y="412" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CANCELLED</text>
      <text x="680" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">abandon</text>
      <text x="680" y="448" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ResumeRefused</text>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="180" y="688" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="212" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="300,696 312,688 324,696 312,704" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="336" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <rect x="432" y="688" width="24" height="12" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="464" y="696" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Fail-closed liveness</text>
      <text x="40" y="712" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace">SEMANTIC --force/--grant → PENDING · REVIEW --grant stays BLOCKED · absence-proven resume recovers that attempt</text>
    </svg>
  </div>
</body>
</html>
