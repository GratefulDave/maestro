<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Escapes from BLOCKED · grant vs resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    html { color-scheme: dark; background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { overflow-x: auto; max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro</p>
    <h1>Escapes from BLOCKED · grant vs resume</h1>

    <svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="32-flow-escape-title 32-flow-escape-desc">
      <title id="32-flow-escape-title">Escapes from BLOCKED · grant vs resume</title>
      <desc id="32-flow-escape-desc">Three BLOCKED escapes after fail-closed scheduler liveness: semantic --force/--grant goes PENDING immediately; a review-budget grant stays BLOCKED until absence-proven run resume; SEMANTIC_BUDGET_EXHAUSTED is resume-refreshed by flooring spend and returning the node to the frontier, not by raising the ceiling. Skip and abandon remain operator escapes but are not this chart.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Arrows (behind nodes) -->
      <line x1="380" y1="88" x2="380" y2="120" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="168" x2="680" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="216" x2="380" y2="316" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="200" x2="760" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="200" x2="840" y2="264" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 720,184 H 568 A 8,8 0 0 0 560,176 V 312 A 8,8 0 0 1 552,320 H 388"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="324" x2="380" y2="360" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="408" x2="220" y2="408" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="408" x2="560" y2="408" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="456" x2="380" y2="504" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 280,528 H 136 A 8,8 0 0 1 128,520 V 440 A 8,8 0 0 0 120,432"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="548" y="148" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="564" y="158" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="388" y="256" width="24" height="12" rx="2" fill="#2d3142"/>
      <text x="400" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="664" y="228" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="708" y="238" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STILL_ALIVE</text>

      <rect x="848" y="228" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="884" y="238" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNKNOWN</text>

      <rect x="500" y="280" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="520" y="290" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEAD</text>

      <rect x="188" y="388" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="224" y="398" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORCE/GRANT</text>

      <rect x="504" y="388" width="56" height="12" rx="2" fill="#2d3142"/>
      <text x="532" y="398" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

      <rect x="388" y="468" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="412" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME</text>

      <rect x="140" y="468" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="164" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLOOR</text>

      <!-- Merge dot: RUNNING dead-or-no -->
      <circle cx="380" cy="320" r="4" fill="#f5f5f5"/>

      <!-- BLOCKED -->
      <rect x="280" y="40" width="200" height="48" rx="20" fill="#2d3142"/>
      <rect x="280" y="40" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="380" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>
      <text x="380" y="76" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">node · attempt</text>

      <!-- RUNNING? -->
      <polygon points="380,120 480,168 380,216 280,168" fill="#2d3142"/>
      <polygon points="380,120 480,168 380,216 280,168" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="380" y="172" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNNING?</text>
      <polygon points="800,120 920,168 800,216 680,168" fill="#2d3142"/>
      <polygon points="800,120 920,168 800,216 680,168" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="800" y="164" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scheduler_liveness</text>
      <text x="800" y="180" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unknown is not dead</text>

      <!-- EscapeRefusal -->
      <rect x="680" y="264" width="240" height="80" rx="20" fill="#2d3142"/>
      <rect x="680" y="264" width="240" height="80" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="800" y="292" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EscapeRefusal</text>
      <text x="800" y="312" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SCHEDULER_STILL_ALIVE</text>
      <text x="800" y="328" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SCHEDULER_LIVENESS_UNKNOWN</text>

      <!-- Which grant / resume? -->
      <polygon points="380,360 500,408 380,456 260,408" fill="#2d3142"/>
      <polygon points="380,360 500,408 380,456 260,408" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="380" y="404" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Which escape?</text>
      <text x="380" y="420" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">grant vs resume</text>

      <!-- PENDING: semantic --force/--grant -->
      <rect x="40" y="384" width="180" height="48" rx="20" fill="#2d3142"/>
      <rect x="40" y="384" width="180" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="130" y="404" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PENDING</text>
      <text x="130" y="420" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEMANTIC --force/--grant</text>

      <!-- REVIEW grant stays BLOCKED (focal) -->
      <rect x="560" y="376" width="280" height="64" rx="20" fill="#2d3142"/>
      <rect x="560" y="376" width="280" height="64" rx="20" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="700" y="404" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stays BLOCKED</text>
      <text x="700" y="420" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REVIEW grant · absence-proven resume</text>

      <!-- SEMANTIC ceiling resume floors spend (focal) -->
      <rect x="280" y="504" width="200" height="48" rx="6" fill="#2d3142"/>
      <rect x="280" y="504" width="200" height="48" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="380" y="524" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">floor spend</text>
      <text x="380" y="540" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEMANTIC_BUDGET_EXHAUSTED</text>

      <text x="40" y="600" fill="#bfc0c0" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Floor, not ceiling removal. Review grant never rides --force.</text>
      <path d="M 280,592 Q 320,560 360,548" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="360" cy="548" r="2" fill="#f5f5f5"/>

      <!-- Legend -->
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="688" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="72" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="180" y="688" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="212" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="300,694 312,688 324,694 312,700" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="336" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <rect x="432" y="688" width="24" height="12" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="464" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">REVIEW stays · SEMANTIC floor</text>

      <circle cx="720" cy="694" r="4" fill="#f5f5f5"/>
      <text x="732" y="698" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Merge</text>

      <text x="40" y="728" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace">SEMANTIC --force/--grant → PENDING · REVIEW --grant stays BLOCKED · SEMANTIC ceiling resume floors spend</text>
    </svg>
  </div>
</body>
</html>
