[pytest]
# The suite builds real git repositories and runs real pytest collection in
# subprocesses -- §13.3's launcher, worktree and merge negatives cannot be
# proven against fakes. That cost is paid per test and it is I/O bound, not
# CPU bound. Measured 2026-08-21: 2554 collected, 395s under `-n auto`.
# An earlier comment recorded 1559 tests / 22:17 serial / 10:40 at 55% CPU;
# that reading is a dated observation that is now superseded, not an invariant.
# A later session measured 2526 collected / 460s under load 39, which is the
# oversubscription `-n auto` produces when six lanes inherit it at once.
# The ceiling here is subprocess and git latency rather than cores.
# Pass counts are identical either way, which is what makes the default safe.

# Anything counting collected cases must still pass `-o addopts=` to clear
# this, exactly as it already must to clear a `-v` that would cancel `-q`.
addopts = -n auto
