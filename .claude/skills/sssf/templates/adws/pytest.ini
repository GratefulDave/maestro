[pytest]
# The suite builds real git repositories and runs real pytest collection in
# subprocesses -- §13.3's launcher, worktree and merge negatives cannot be
# proven against fakes. That cost is paid per test and it is I/O bound, not
# CPU bound: 1559 tests take 22:17 serially and 10:40 under `-n auto` at 55%
# CPU, so the ceiling here is subprocess and git latency rather than cores.
# Pass counts are identical either way, which is what makes the default safe.
#
# Anything counting collected cases must still pass `-o addopts=` to clear
# this, exactly as it already must to clear a `-v` that would cancel `-q`.
addopts = -n auto
