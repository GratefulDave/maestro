schema: maestro-config.v1
runtime_state_root: /nonexistent/maestro-runtime-state
# Worker threads for independent ready lanes (author/review/build stages).
# Merges are serialized at any value. 1 keeps every stage inline.
concurrency: 1
# A tests round is measured by its review's findings count. Plateau and
# repeated content park a lane at any setting; true also parks it on one
# worse round. Absent means false.
stall:
  regression_on_findings: false
role_routes:
  tester:
    route: omp
    profile: grok
  test-reviewer:
    route: omp
    profile: openai-performance
  builder:
    route: claude
    model: opus
    effort: high
  code-reviewer:
    route: omp
    profile: openai-performance
  integration-reviewer:
    route: omp
    profile: openai-performance
executables:
  herdr: herdr
  omp: omp
  claude: claude
