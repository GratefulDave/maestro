schema: maestro-config.v1
runtime_state_root: /nonexistent/maestro-runtime-state
# keys_dir: absolute directory holding reviewer-hmac.key (and the other keys
# route_admission.provision_keys mints). Omitted, it is <runtime_state_root>/keys.
# Set it when the keys live elsewhere, e.g. /Users/<you>/.maestro/<project>/keys.
# Worker threads for independent ready lanes (author/review/build stages).
# Merges are serialized at any value. 1 keeps every stage inline.
concurrency: 1
# A tests round is measured by its review's findings count. Plateau and
# repeated content park a lane at any setting; true also parks it on one
# worse round. Absent means false.
stall:
  regression_on_findings: false
# `run attend` lets the scheduler settle, then answers every NO_PROGRESS and
# AMENDMENT_REQUIRED park with one plan amendment instead of stopping for a
# human. PAUSE and LANE_FAULT still stop it. The planctl review behind it
# runs its mutation pass on EC2 by default; `run attend --local` opts out.
# Opt-in: 0 (and absent) refuses
# the verb with ATTEND_DISABLED, so an upgraded deployment keeps parking for
# its operator until someone sets this key in *this* file. The operator agent
# it dispatches reads the accepted suite, as builders and reviewers do in
# their own checkouts; an independent reviewer agent reviews what it wrote.
attend:
  max_amendments_per_lane: 0
  max_amendments_per_run: 10
  # REVISE rounds the reviewer may return before the verb stops
  # REVIEW_UNRESOLVED with nothing applied. Absent means 3.
  # max_review_rounds: 3
  # The author. Required once max_amendments_per_lane is set. Same shape as
  # a role route, admitted by the same executed route receipt, plus the
  # `vendor:` of the provider it runs on.
  # route:
  #   route: claude
  #   model: opus
  #   effort: medium
  #   vendor: anthropic
  # The independent reviewer. Required once max_amendments_per_lane is set,
  # admitted by the same route receipt. reviewer_vendor is required with it
  # and must differ from route.vendor; `planctl review` signs as this agent.
  # reviewer_route:
  #   route: omp
  #   profile: openai-astra
  # reviewer_vendor: openai
  # Absolute path to the plan-contract validator. Absent refuses
  # ATTEND_PLANCTL_UNRESOLVED rather than approving an unvalidated revision.
  # planctl: /absolute/path/to/planctl.py
  # Absolute path to the Plan IR the run's current revision was projected
  # from. Preflight copies it, with its sources, into the revision's planctl
  # root under runtime_state_root/plans/<run>/r<N>/, where every attended
  # amendment writes its own. Absent refuses ATTEND_PLAN_IR_UNRESOLVED
  # rather than handing an agent a projected plan to edit as an IR.
  # plan_ir: /absolute/path/to/plan.ir.json
# Reviewer-authored probes: how many code reviews per lane (since its last
# resume) may admit a new probe. 0 turns the feature off. Absent means 5.
review:
  max_probe_rounds: 5
# Each lane role declares the `vendor:` of the provider its route runs on. A
# probe is accepted by a role whose declared vendor differs from the
# code-reviewer's; a different profile or model is not independence, and an
# undeclared vendor is not guessed, so probes stay inactive for a role with
# none. Values here come from the provider each route resolves to: the omp
# `grok` profile defaults to xai-oauth/grok-*, `openai-performance` to
# openai-codex/gpt-*, and the claude route is anthropic.
role_routes:
  tester:
    route: omp
    profile: grok
    vendor: xai
  test-reviewer:
    route: omp
    profile: openai-performance
    vendor: openai
  builder:
    route: claude
    model: opus
    effort: high
    vendor: anthropic
  code-reviewer:
    route: omp
    profile: openai-performance
    vendor: openai
  integration-reviewer:
    route: omp
    profile: openai-performance
    vendor: openai
executables:
  herdr: herdr
  omp: omp
  claude: claude
# A reused role session larger than this many tokens (estimated from its
# transcript, or from the prompts and envelopes it exchanged) is replaced at
# the next dispatch by a fresh one seeded with a compact handoff. 0 turns the
# cap off. Absent means 150000.
# role_session_max_tokens: 150000
