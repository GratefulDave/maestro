schema: maestro-config.v1
plans_dir: .maestro/plans
state_root: ../.maestro-state
keys:
  verify_key_env: MAESTRO_VERIFY_KEY
  signing_seed_env: MAESTRO_SIGNING_SEED
  route_verify_key_env: MAESTRO_ROUTE_VERIFY_KEY
executables:
  herdr: herdr
  omp: omp
  claude: claude
# The interpreter each gate runner is executed as. Optional, and binding when
# present: a declared runner is probed for its ability to collect in this
# repository and refuses `RUNNER_UNUSABLE` if it cannot, rather than falling
# back to a guess. Omit the block and Maestro discovers one — repository
# environment first, then `uv run`, then `poetry run`, then PATH — probes it,
# records the choice in the run's `runner-resolution.json`, and prints the
# block to adopt. Declaring it is what removes the dependence on whatever PATH
# the shell that started the scheduler happened to carry.
#
# vitest is NOT usable yet. Its capability probe has never been measured, so
# `runner_resolution` has no probe row for it and any vitest gate refuses
# `RUNNER_UNUSABLE:UNRESOLVED` whether or not it is declared here. The line is
# shown so the shape is unambiguous when that row lands, not because
# uncommenting it would work today.
#
# runners:
#   pytest: .venv/bin/pytest
#   vitest: node_modules/.bin/vitest   # refused: no measured probe row
route_receipts:
  omp: route-receipts/omp.json
  claude: route-receipts/claude.json
# The plan-authoring lane `maestro deliver` drives. It rides the already
# admitted `claude` route; `profile` is omitted because only the omp route's
# argv carries one.
author:
  route: claude
  model: opus
  effort: high
  author_timeout_s: 3600
  turn_timeout_s: 300
  poll_interval_s: 2
reviewer:
  route: claude
  model: opus
  effort: high
  id: maestro-independent-reviewer
  vendor: anthropic
  finalization_timeout_s: 600
  turn_timeout_s: 120
  poll_interval_s: 1
execution:
  route: omp
  model: grok-4.6
  effort: high
  profile: grok
  # Compared against reviewer.vendor at preflight so no actor reviews its own
  # output (B12). Config-derived, not receipt-proven: route receipts are keyed
  # by route, and both profiles ride the same admitted `omp` receipt.
  vendor: xai
  concurrency: 6
  node_timeout_s: 1800
  turn_timeout_s: 300
  final_acceptance_timeout_s: 900
  backstop_t_s: 7200
  semantic_ceiling: 3
  # Attempts a node may spend on code-review rejections, counted separately
  # from semantic_ceiling. Three total: reject, reject, reject -> the lane
  # blocks REVIEW_BUDGET_EXHAUSTED with the findings reported.
  review_ceiling: 3
  # Section 7.5's two non-semantic budgets, plus the credential rule's zero.
  # These are the numbers the scheduler spends on faults that are not the
  # code's fault: an OS error, a timeout, a git failure, a pane that would not
  # allocate. CREDENTIAL is zero on purpose -- retrying a rejected credential
  # cannot produce a different answer, and spending a budget on it only delays
  # the refusal an operator has to act on.
  environmental_retries: 2
  launcher_retries: 2
  credential_retries: 0
  # Section 8.3's provision step: the ecosystem's setup command, run in every
  # attempt's fresh worktree after `git worktree add` and before the pre-node
  # gate and the baseline inventory. Real argv, one list entry per word.
  #
  # Omitted here because this template ships a Python factory whose gates are
  # pytest, and section 9.3's default for such a runner is a no-op. A
  # JavaScript or TypeScript installation MUST set it -- without an install
  # step every gate in the repository is red because nothing is installed, and
  # section 7.4's falsifiable pre-gate then proves nothing about the work:
  #
  #   provision: ["npm", "ci"]
  #
  # Use the ecosystem's concurrency-safe install invocation. Up to
  # `concurrency` provisions may share the download cache at once.
