id = "maestro-lanes"
name = "Maestro lanes"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Sidebar vendor logos, held activity marks, and Maestro lane stage / review round / verdict."
platforms = ["macos", "linux"]

# Startup hooks are one-shot: this spawns the detached daemon and exits.
[[startup]]
command = ["/bin/sh", "bin/run.sh"]

# Watchdog: a crashed daemon comes back the next time an agent is detected.
[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "bin/run.sh"]

[[actions]]
id = "start"
title = "Maestro lanes: start daemon"
command = ["/bin/sh", "bin/run.sh"]

[[actions]]
id = "stop"
title = "Maestro lanes: stop daemon and clear its tokens"
command = ["/bin/sh", "bin/run.sh", "--stop"]

[[actions]]
id = "configure"
title = "Maestro lanes: write the managed sidebar block"
command = ["/bin/sh", "bin/run.sh", "--configure"]

[[actions]]
id = "unconfigure"
title = "Maestro lanes: remove the managed sidebar block"
command = ["/bin/sh", "bin/run.sh", "--unconfigure"]

[[actions]]
id = "install-font"
title = "Maestro lanes: install icon font and Ghostty codepoint map"
command = ["/bin/sh", "bin/run.sh", "--install-font"]

[[actions]]
id = "uninstall-font"
title = "Maestro lanes: remove icon font and Ghostty codepoint map"
command = ["/bin/sh", "bin/run.sh", "--uninstall-font"]
